name: Dependency audit

# Supply-chain gate: audits SHIPPED (production) dependencies against the npm
# advisory database and blocks the PR on a high-or-worse advisory.
# npm audit is used instead of dependency-review-action because this repo is
# private (dependency-review needs GitHub Advanced Security on private repos).
# Dev tooling (vitest, esbuild) is excluded via --omit=dev — it never ships.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: [editor, extension]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
