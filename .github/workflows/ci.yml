name: CI

on:
  push:
  pull_request:
    branches:
      - main

# Cancel in-progress runs for the same PR/branch to save minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editor

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test:
    name: Unit & round-trip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editor

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests and markdown round-trip
        run: npm run test

  markmap-smoke:
    name: Markmap render smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Render markmap HTML
        run: |
          mkdir -p .ci-artifacts
          ./render-markmap.sh sprint-tasks.md .ci-artifacts/sprint-tasks

      - name: Verify HTML output
        run: test -s .ci-artifacts/sprint-tasks.html

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: editor

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ github.run_number }}
          path: |
            editor/playwright-report/
            editor/test-results/
          retention-days: 7

  extension-test:
    name: Extension unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `pretest` runs build-assets.mjs to embed markmap vendor JS/CSS before vitest.
      - name: Run unit tests
        run: npm test

  extension-build:
    name: Extension build (markmap bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extension

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build markmap bundle
        run: npm run build

      # The bundle source legitimately contains markmap-lib's default CDN provider
      # templates (dead code — never invoked; our renderer inlines all assets from
      # embedded-assets). The meaningful CSP check is on the RENDERED OUTPUT, so we
      # render sample markdown through the bundle and assert the HTML is CDN-free.
      - name: Verify bundle exists and rendered output is CDN-free
        run: |
          test -s editor/markmap-bundle.js
          node --input-type=module -e "
            import { renderMarkmapHtml } from './editor/markmap-bundle.js';
            const html = await renderMarkmapHtml('# Sprint\n## Task A\n## Task B');
            if (/cdn\.jsdelivr\.net|unpkg\.com/i.test(html)) {
              console.error('::error::rendered markmap HTML contains a CDN URL (CSP would block it)');
              process.exit(1);
            }
            if (!html.includes('<svg') || !html.includes('Sprint')) {
              console.error('::error::rendered markmap HTML missing expected structure');
              process.exit(1);
            }
            console.log('Rendered output is CDN-free and well-formed');
          "

  extension-e2e:
    name: Extension Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: extension

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build extension assets
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Extension E2E loads the unpacked extension via --load-extension; a headed
      # Chromium is required (headless does not load MV3 extensions), so run under xvfb.
      - name: Run extension Playwright tests
        run: xvfb-run -a npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: extension-playwright-report-${{ github.run_number }}
          path: |
            extension/playwright-report/
            extension/test-results/
          retention-days: 7
