<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e88e5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sprint Map" />
    <title>Mindmap Editor</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="stylesheet" href="/vendor/style.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-left">
        <h1>Sprint Mindmap Editor</h1>
        <button type="button" id="file-name" class="file-name" title="Open file panel"></button>
      </div>
      <div class="toolbar-actions">
        <button type="button" id="btn-markers" data-testid="btn-markers" title="Markers panel (Ctrl/Cmd+Shift+M)">
          Markers
        </button>
        <button type="button" id="btn-save" title="Save to markdown (Ctrl/Cmd+S)">
          Save
        </button>
        <button type="button" id="btn-expand-all">Expand all</button>
        <button type="button" id="btn-collapse-all">Collapse all</button>
        <button type="button" id="btn-fit" title="Fit to view (F1)">Fit</button>
        <button type="button" id="btn-install" class="install-btn hidden" title="Install as standalone app">
          Install app
        </button>
      </div>
      <div class="toolbar-right">
        <span id="hotkey-hint" class="hotkey-hint"></span>
        <div class="legend" aria-label="Priority legend">
          <span class="legend-item"><span class="marker-pri pri-1">1</span> Critical</span>
          <span class="legend-item"><span class="marker-pri pri-2">2</span> High</span>
          <span class="legend-item"><span class="marker-pri pri-3">3</span> Medium</span>
          <span class="legend-item"><span class="marker-pri pri-4">4</span> Low</span>
          <span class="legend-item"><span class="marker-pri pri-5">5</span> Lowest</span>
        </div>
        <span id="status" class="status" data-testid="status" aria-live="polite">loading…</span>
      </div>
    </header>

    <main id="map" data-testid="map" tabindex="-1"></main>


    <aside id="file-panel" class="file-panel hidden" data-testid="file-panel" aria-label="Workspace files">
      <div class="panel-header">
        <strong>Files</strong>
        <button type="button" id="btn-file-close" class="panel-close" aria-label="Close">×</button>
      </div>
      <ul id="file-list" class="file-list"></ul>
      <div class="panel-actions">
        <button type="button" id="btn-new-file">New file</button>
        
        <button type="button" id="btn-export">Export…</button>
      </div>
      
    </aside>
    <aside id="export-panel" class="export-panel hidden" data-testid="export-panel" aria-label="Export options">
      <div class="panel-header">
        <strong>Export</strong>
        <button type="button" id="btn-export-close" class="panel-close" aria-label="Close">×</button>
      </div>
      <div class="export-actions">
        <button type="button" id="btn-export-png">Download PNG</button>
        <button type="button" id="btn-export-svg">Download SVG</button>
        <button type="button" id="btn-open-markmap">Open markmap HTML</button>
      </div>
    </aside>
    <aside id="marker-picker" class="marker-picker hidden" data-testid="marker-picker" aria-label="XMind markers"></aside>

    <aside id="priority-filter" class="priority-filter hidden" aria-label="Priority filter">
      <button
        type="button"
        id="btn-priority-filter"
        class="priority-filter-btn"
        data-testid="priority-filter-btn"
        disabled
      >
        <span id="filter-badge" class="pri-badge"></span>
        <span id="filter-label">Priority</span>
      </button>
      <p id="filter-hint" class="priority-filter-hint">
        Select a task with a priority to filter.
      </p>
    </aside>

    <script type="module" src="/app.js"></script>
  </body>
</html>
